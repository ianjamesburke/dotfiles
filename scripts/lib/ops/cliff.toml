[changelog]
header = "# Changelog\n\n"
body = """
## {{ version | default(value="Unreleased") | trim_start_matches(pat="v") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}- {{ commit.message | split(pat="\n") | first | trim }}
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
filter_commits = true
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+$'
sort_commits = "newest"
commit_parsers = [
    { message = '^chore: (release|bump|promote)', skip = true },
    { message = '^Merge', skip = true },
    { message = '^(chore|docs|test|refactor|style|ci|build)(\([^)]*\))?:', skip = true },
    { message = '^feat(\([^)]*\))?!?:', group = "Added" },
    { message = '^fix(\([^)]*\))?!?:', group = "Fixed" },
    { message = '^perf(\([^)]*\))?!?:', group = "Performance" },
    { message = '.*', group = "Changed" },
]
